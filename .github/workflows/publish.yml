# Publishes the VSIX attached to a GitHub Release to the VS Code Marketplace
# and Open VSX. It never builds: it ships the exact file on the release, after
# checking its SHA-256 and version.
#
# - Runs only when a release is published, and only after approval in the
#   `release` environment (restricted to `v*` tags).
# - Both registries use OIDC trusted publishing, so no publishing secrets are
#   stored anywhere.
# - Uses no third-party actions, only tools preinstalled on the runner.
# - Retrying a failed job is safe: `--skip-duplicate` skips a version that is
#   already live.
name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}
  VSCE_VERSION: 4.0.0
  OVSX_VERSION: 1.3.0

jobs:
  marketplace:
    name: VS Code Marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - &fetch
        name: Download and verify the release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag"; exit 1; }
          node -e 'if (+process.versions.node.split(".")[0] < 22) { console.error(`::error::Node ${process.version} is too old; 22+ needed`); process.exit(1) }'
          version="${TAG#v}"
          vsix="retroscope-$version.vsix"
          mkdir -p dist && cd dist
          gh release download "$TAG" --pattern "$vsix" --pattern "$vsix.sha256"
          sha256sum --check --strict "$vsix.sha256"
          got=$(unzip -p "$vsix" extension/package.json | jq -r .version)
          [ "$got" = "$version" ] || { echo "::error::$vsix has version $got, expected $version"; exit 1; }
          echo "VSIX=$PWD/$vsix" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish
        run: npx --yes "@vscode/vsce@$VSCE_VERSION" publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: Report the live version
        run: |
          live=$(npx --yes "@vscode/vsce@$VSCE_VERSION" show dvsu.retroscope --json | jq -r '.versions[0].version')
          echo "VS Code Marketplace: $live (released $VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"

  open-vsx:
    name: Open VSX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - *fetch

      - name: Publish
        run: npx --yes "ovsx@$OVSX_VERSION" publish --trusted-publishing --skip-duplicate --packagePath "$VSIX"

      - name: Report the live version
        run: |
          live=$(curl -fsS https://open-vsx.org/api/dvsu/retroscope | jq -r .version)
          echo "Open VSX: $live (released $VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
