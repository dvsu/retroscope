<!doctype html>
<html lang="en">
  <head>

    <title>Retro Shop</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body class="dark">
    <!-- Main navigation -->
    <nav id="top" aria-label="Main">
      <a href="/" class="logo">Retro&nbsp;Shop</a>

      document.querySelector("#top").hidden = false;

  </body>
</html>
